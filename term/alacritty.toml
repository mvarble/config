live_config_reload = true

[colors]
draw_bold_text_with_bright_colors = false

[cursor.style]
blinking = "Off"
shape = "Block"

[font]
size = 6

[font.bold]
family = "Fira Code Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Fira Code Nerd Font"
style = "Demi Bold"

[font.italic]
family = "Fira Code Nerd Font"
style = "Regular"

[font.normal]
family = "Fira Code Nerd Font"
style = "Light"

[shell]
program = "tmux"

[window]
opacity = 1.0

[window.dimensions]
columns = 120
lines = 40

[window.padding]
x = 1
y = 1

[window.position]
x = 100
y = 100
