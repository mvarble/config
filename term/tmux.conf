# set prefix to CTRL-b
set-option -g prefix C-b
bind-key C-b send-prefix

# use CTRL-* keys to create panes
bind -n C-O split-window -h -c '#{pane_current_path}'
bind -n C-U split-window -v -c '#{pane_current_path}'

# use CTRL-vim keys to switch panes
bind -n C-H select-pane -L
bind -n C-J select-pane -D 
bind -n C-K select-pane -U
bind -n C-L select-pane -R

# use CTRL-T to create a new window at same path
bind -n C-T new-window -c '#{pane_current_path}'

# use CTRL-<number>  keys to move between windows
set -g base-index 1
set -g pane-base-index 1
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t:$

# use <prefix> up/down to move windows
bind Up swap-window -t -1 \; select-window -t -1
bind Left swap-window -t -1 \; select-window -t -1
bind Down swap-window -t +1 \; select-window -t +1
bind Right swap-window -t +1 \; select-window -t +1

# set focus events on
set-option -g focus-events on

# move around with vim keys
set -g mode-keys vi
set -g status-keys vi
bind k copy-mode

# reset the numbers with <prefix> Space
bind Space movew -r

# use <prefix>-r to rename window (instead of <prefix> $)
bind r command-prompt -I 'rename-window '

# use <prefix>-t to rename session
bind t command-prompt -I 'rename-session '

# select panes with mouse
set -g mouse on
set-option -s set-clipboard off

# use fish
set-option -g default-shell /usr/local/bin/fish

# bottom bar
set -g status on
set -g status-interval 1
set -g status-left '[rattail:#S] '
set -g status-left-length 20
set -g status-style 'bg=black,fg=default'
set -g status-right ' #{?client_prefix,#[reverse]<Prefix>#[noreverse] ,}%Y-%m-%d, %H:%M:%S'

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tinted-theming/base16-tmux'

# yank config
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe'
set -g @yank_with_mouse 'on'

# base16 config
set -g allow-passthrough on
set -g @colors-base16 'tomorrow-night-eighties'

# initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# highlight/active colors
set -g mode-style 'bg=blue,fg=black'
set -g pane-active-border-style 'fg=blue'
