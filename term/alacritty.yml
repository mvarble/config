live_config_reload: true

window:
  dimensions:
   columns: 120
   lines: 40
  padding:
    x: 1
    y: 1
  position:
    x: 100
    y: 100
  opacity: 0.9

font:
  normal:
    family: Fira Code
    style: Light
  bold:
    family: Fira Code
    style: Bold
  italic:
    family: Fira Code
    style: Regular
  bold_italic:
    family: Fira Code
    style: Semibold
  size: 10

draw_bold_text_with_bright_colors: false

cursor:
  style:
    shape: Block
    blinking: Off

shell:
  program: tmux
