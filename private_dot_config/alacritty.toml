[colors]
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#eff1f5"
foreground = "#4c4f69"

[cursor.style]
blinking = "Off"
shape = "Block"

[font]
size = 10

[font.bold]
family = "Fira Code Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Fira Code Nerd Font"
style = "Demi Bold"

[font.italic]
family = "Fira Code Nerd Font"
style = "Regular"

[font.normal]
family = "Fira Code Nerd Font"
style = "Light"

[terminal.shell]
program = "tmux"

[window]
opacity = 1.0
dynamic_padding = true

[window.dimensions]
columns = 120
lines = 40

[window.padding]
x = 0
y = 0

[window.position]
x = 100
y = 100

[general]
live_config_reload = true

[terminal]
