# ==========================================
# 1. General & Environment Settings
# ==========================================
set -g default-shell /usr/bin/fish
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set-option -g prefix C-b
bind-key C-b send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g history-limit 1000000
set-option -sg escape-time 250
set-option -g focus-events on

# Mouse & Copy Mode
set -g mouse on
set-option -s set-clipboard off
set -g mode-keys vi
set -g status-keys vi
bind c copy-mode

# ==========================================
# 2. Keybindings
# ==========================================
# Split panes
bind o split-window -h -c '#{pane_current_path}'
bind u split-window -v -c '#{pane_current_path}'

# Move between panes (Vim keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window management
bind t new-window -c '#{pane_current_path}'
bind n select-window -t :-1
bind m select-window -t :+1
bind Space movew -r

# Move windows around
bind Up swap-window -t -1 \; select-window -t -1
bind Left swap-window -t -1 \; select-window -t -1
bind Down swap-window -t +1 \; select-window -t +1
bind Right swap-window -t +1 \; select-window -t +1

# ==========================================
# 3. Status Bar Setup
# ==========================================
set -g status on
set -g status-interval 1
set -g status-left-length 20
set -g status-left '[#H:#S] '
set -g status-right ' #{?client_prefix,#[reverse]<Prefix>#[noreverse] ,}%Y-%m-%d, %H:%M:%S'

# ==========================================
# 4. Plugins & Plugin Configuration
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'

# Yank options
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe'
set -g @yank_with_mouse 'on'

# Catppuccin theme configuration
set -g -q @catppuccin_flavor "latte"
set -g @catppuccin_status_background "#eff1f5"

# ==========================================
# 5. Initialize TPM
# ==========================================
run '~/.config/tmux/plugins/tpm/tpm'

# ==========================================
# 6. Color Overrides (MUST BE AFTER TPM)
# ==========================================
set -g window-style "fg=#4c4f69,bg=#eff1f5"
set -g window-active-style "fg=#4c4f69,bg=#eff1f5"
set -g pane-border-style "fg=#ccd0da,bg=#eff1f5"
set -g pane-active-border-style "fg=#1e66f5,bg=#eff1f5"
set -g status-style "bg=#eff1f5,fg=#4c4f69"
