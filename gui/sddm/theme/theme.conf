[General]

# Solid background color (shown when backgroundImage is empty or missing)
backgroundColor=#86b2f6

# Background image file, relative to the theme directory (e.g. background.jpg)
backgroundImage=./assets/tile.png

# Accent color for the login panel
accent=#7aa2f7

# --- Login panel -------------------------------------------------------

# Panel sizing: fraction of the screen width, plus an absolute minimum
panelWidthRatio=0.2
panelMinWidth=240

# Fallback panel color when no backgroundImage is set (supports #AARRGGBB)
panelColor=#86b2f6

# Frosted-glass blur radius in pixels
blurRadius=80

# Corner radius of inputs and buttons
controlRadius=10

# Error message color
errorColor=#f7768e

# --- Typography --------------------------------------------------------

# Clock typography; empty font = system default
timeFont=Benubu
timeFontSize=48
timeColor=#ffffff

# Date typography; empty font = system default
dateFont=Benubu
dateFontSize=32
dateColor=#ffffff

# Date line opacity relative to the clock (0.0 - 1.0)
dateOpacity=0.7

# Input field typography (username, password, session picker)
inputFontSize=16
inputColor=#ffffff

# --- Controls ----------------------------------------------------------

# Input fields (username, password, session picker): border and
# background. Empty = accent-derived default; "transparent" and
# #AARRGGBB are valid values.
inputBorderColor=#7aa2f7
inputBackgroundColor=#4086b2f6

# Fill buttons with the accent color (true) or keep them border-only (false)
buttonFill=true

# Button colors. Empty = derived from buttonFill (accent fill / white
# text when true, transparent / accent text when false).
buttonTextColor=
buttonBorderColor=
buttonBackgroundColor=#7aa2f7
buttonHoverBackgroundColor=

# Highlight colors when hovering/focusing controls
hoverBorderColor=#ffb100
hoverFillColor=#ffb100

# --- Scene and lighting ------------------------------------------------

# Camera field of view in degrees
cameraFov=60

# Brightness of the key light and the fill light
lightBrightness=1.0
fillBrightness=0.35

# --- Swarm -------------------------------------------------------------

# Number of rats in the swarm
ratCount=20

# Per-rat scales are sampled randomly between these two values
ratScaleMin=1.0
ratScaleMax=50.0

# Motion feel (per-rat jitter is applied on top)
ratMaxSpeed=8.0
springStiffness=8.0
springDamping=5.0
rotationStiffness=6.0

# Wiggle: bob height in world units, and distance traveled per full bob
wiggleAmplitude=0.10
wiggleWavelength=0.8

# Click startle: how far the scare reaches and how hard it kicks
scareRadius=12.0
scareStrength=40.0
