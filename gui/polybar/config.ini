[colors]
background = #111111
background-alt = #1f1f1f
foreground = #efefef
primary = #8899ef
alert = #A54242
disabled = #888888

[bar/template]
width = 100%
height = 24pt
line-size = 5pt
border-size = 0
padding-left = 0
padding-right = 1
module-margin = 1
radius = 0

bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

separator = |
separator-foreground = ${colors.disabled}

font-0 = SF Mono:style=Light:size=10;2
font-1 = Font Awesome 6 Brands:style=Solid:size=10;2
font-2 = Font Awesome 6 Free:style=Solid:size=10;2
font-3 = Roboto

modules-left = xworkspaces xwindow
modules-right = dropbox pulseaudio memory date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = bspwm

[bar/ratcage1]
inherit = bar/template
monitor = ${env:MONITOR_MAIN}
modules-left = xworkspaces-pinned xwindow

[bar/ratcage2]
inherit = bar/template
monitor = ${env:MONITOR_ALT}
modules-left = xworkspaces-pinned xwindow

[bar/rattail]
dpi-x = ${env:CUSTOM_DPI}
dpi-y = ${env:CUSTOM_DPI}
index-sort = true
inherit = bar/template
monitor = ${env:MONITOR_MAIN}
modules-right = dropbox pulseaudio backlight memory battery date

[bar/ratbutt]
inherit = bar/template
monitor = ${env:MONITOR_MAIN}
padding-left = 1
modules-left = xworkspaces-pinned xwindow
modules-right = dropbox pulseaudio backlight filesystem memory battery date

[module/xworkspaces-pinned]
inherit = module/xworkspaces
pin-workspaces = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/filesystem]
type = internal/fs
interval = 10
mount-0 = /
label-mounted = %{F#8899ef}🖴%{F-} %free%
fixed-values = true

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/dropbox]
type = custom/script
interval = 1
exec = ~/.config/polybar/scripts/isrunning-dropbox.sh
click-left = ~/.config/polybar/scripts/isrunning-dropbox.sh --toggle &
label = %{F#8899ef} %{F-}%output%


[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "🔊 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/backlight]
type = internal/xbacklight
enable-scroll = true
label = %{F#8899ef}%{F-} %percentage%%

[module/pornhub]
type = custom/script
exec = echo "hub"
interval = 3600
click-left = firefox --private-window https://pornhub.com/random &

format = <label>
format-prefix = "Porn"
format-prefix-foreground = #ffffff
format-prefix-background = #000000

format-foreground = #000000
format-background = #ffa500
format-underline= ${colors.background}
format-overline= ${colors.background}

format-font = 4
label-font = 4

[module/battery]
type = internal/battery

time-format = %H:%M

format-full = %{F#8899ef}%{F-} <label-full>
label-full = %percentage%%

format-charging = %{F#8899ef}<animation-charging>%{F-} <label-charging>
label-charging = %percentage%% %time%

format-discharging = %{F#8899ef}<ramp-capacity>%{F-} <label-charging>
label-discharging = %percentage%% %time%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 100

interval = 3

[settings]
screenchange-reload = true
pseudo-transparency = true
